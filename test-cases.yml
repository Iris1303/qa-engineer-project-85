- summary: |
    Проверка регистрации пользователя на сайте
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться и войти в
    аккаунт при помощи email и пароля
  prerequisites: |
    Окрыта главная страница сайта
  test-data: |
    Nickname = ava Email = новый, который ранее не регестрировался на
    этом сайте Password = 1234567Z!
  steps:
    - нажать "Sign up"
    - заполнить поле "Nickname"
    - заполнить поле "Email"
    - заполнить поле "Password"
    - заполнить "Password Confirmation"
    - нажать "Submit"
  expected-result: |
    Регистрация выполнена успешно, пользователь попадает на главную
    страницу сайта

